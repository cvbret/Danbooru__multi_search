[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "danbooru-multi-search"
version = "0.1.0"
description = "Cross-platform Danbooru desktop browser"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.12,<6.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
danbooru-multi-search = "danbooru_multi_search.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danbooru_multi_search = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

